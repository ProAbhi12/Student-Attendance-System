<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />


</head>
<body class="bg-dark">

        <!-- roast -->
        <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container">
            <div class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true" id="Toast">
                <div class="d-flex">
                <div class="toast-body">
                    Email Has been Sent To Your Email Account.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>

 

    <div class="container   rounded-4 shadow-primary mt-5 py-3 "
    style="background-color: rgb(235, 229, 229); width:80%; ">
        <div id="#" class="row align-items-center mx-0">
            <div class="col-12 col-md-6">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/040/890/255/small/ai-generated-empty-wooden-table-on-the-natural-background-for-product-display-free-photo.jpg" 
            alt="Image"
            width="100%"
            class="border rounded-4">
            </div>

            <div  class="col-12 col-md-6 d-grid gap-3" >
            <h1 class="text-center">Forgot Password</h1>
            <input class="form-control" type="Email" placeholder="Email">
            
            <button class="btn btn-primary" onclick="submitAction()" >Confirm</button>       

            </div>

        </div>
    </div>


    <script>
        function submitAction() {
            // Show the Denied Toast
            var deniedToast = new bootstrap.Toast(document.getElementById('Toast'));
            deniedToast.show();
        }
    </script>

    <!-- BS5 Js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    
</body>
</html>
