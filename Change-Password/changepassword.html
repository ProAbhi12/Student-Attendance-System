<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .password-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .password-card:hover {
            transform: translateY(-5px);
        }
        
        .password-icon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .password-strength {
            height: 4px;
            border-radius: 2px;
            background: #e9ecef;
            overflow: hidden;
        }
        
        .strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div class="password-card p-4 p-md-5">
                    <div class="row align-items-center">
                        <!-- Image Section -->
                        <div class="col-lg-6 text-center mb-4 mb-lg-0">
                            <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" 
                                 alt="Security" class="img-fluid rounded-3 shadow">
                            <div class="mt-4">
                                <h5 class="text-primary fw-bold">Secure Your Account</h5>
                                <p class="text-muted mb-0">Keep your information safe with a strong password</p>
                            </div>
                        </div>
                        
                        <!-- Form Section -->
                        <div class="col-lg-6">
                            <div class="text-center mb-4">
                                <div class="password-icon mb-3">
                                    <i class="fas fa-lock text-white fs-4"></i>
                                </div>
                                <h3 class="fw-bold text-primary mb-2">Change Password</h3>
                                <p class="text-muted">Update your account credentials</p>
                            </div>
                            
                            <form id="passwordForm">
                                <!-- Old Password -->
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Current Password</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="currentPassword" placeholder="Enter current password" required>
                                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('currentPassword')">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                
                                <!-- New Password -->
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">New Password</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required>
                                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('newPassword')">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                    <div class="password-strength mt-2">
                                        <div class="strength-bar bg-danger" id="passwordStrength"></div>
                                    </div>
                                    <div class="form-text">
                                        Use 8+ characters with letters, numbers & symbols
                                    </div>
                                </div>
                                
                                <!-- Confirm Password -->
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Confirm Password</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" required>
                                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword')">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                    <div class="form-text text-danger" id="matchMessage"></div>
                                </div>
                                
                                <!-- Requirements -->
                                <div class="mb-4 p-3 bg-light rounded">
                                    <small class="text-muted fw-semibold d-block mb-2">Password Requirements:</small>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" id="req1" disabled>
                                        <label class="form-check-label small" for="req1">8+ characters</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" id="req2" disabled>
                                        <label class="form-check-label small" for="req2">Letters & numbers</label>
                                    </div>
                                </div>
                                
                                <!-- Submit Button -->
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                                    <i class="fas fa-key me-2"></i> Update Password
                                </button>
                                
                                <div class="text-center">
                                    <a href="#" class="text-decoration-none text-primary">
                                        <i class="fas fa-arrow-left me-1"></i> Back to Login
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentNode.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }
        
        // Password strength and matching
        document.getElementById('newPassword').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('passwordStrength');
            const req1 = document.getElementById('req1');
            const req2 = document.getElementById('req2');
            
            // Check requirements
            const hasLength = password.length >= 8;
            const hasLettersNumbers = /[a-zA-Z]/.test(password) && /[0-9]/.test(password);
            
            // Update checkboxes
            req1.checked = hasLength;
            req2.checked = hasLettersNumbers;
            
            // Update strength bar
            let strength = 0;
            if (hasLength) strength += 50;
            if (hasLettersNumbers) strength += 50;
            
            strengthBar.style.width = strength + '%';
            strengthBar.className = 'strength-bar ' + (
                strength < 50 ? 'bg-danger' : 
                strength < 100 ? 'bg-warning' : 'bg-success'
            );
            
            // Check password match
            checkPasswordMatch();
        });
        
        document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);
        
        function checkPasswordMatch() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const message = document.getElementById('matchMessage');
            
            if (!confirmPassword) {
                message.textContent = '';
            } else if (newPassword === confirmPassword) {
                message.textContent = '✓ Passwords match';
                message.className = 'form-text text-success';
            } else {
                message.textContent = '✗ Passwords do not match';
                message.className = 'form-text text-danger';
            }
        }
        
        // Form submission
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!currentPassword) {
                alert('Please enter your current password');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            if (newPassword.length < 8) {
                alert('Password must be at least 8 characters long');
                return;
            }
            
            // Show success message
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Updating...';
            submitBtn.disabled = true;
            
            setTimeout(() => {
                alert('Password updated successfully!');
                this.reset();
                document.getElementById('passwordStrength').style.width = '0%';
                document.getElementById('matchMessage').textContent = '';
                document.getElementById('req1').checked = false;
                document.getElementById('req2').checked = false;
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }, 1500);
        });
    </script>
</body>
</html>
