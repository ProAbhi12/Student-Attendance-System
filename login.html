<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
      html, body { max-height: 100%;
      max-width: 100%; 
        overflow-x: hidden;
        
    }

      .shadow-primary {
        box-shadow: 0 0.5rem 1rem rgba(207, 214, 216, 0.5); /* primary color with opacity */
      }

      .fade-section {
        opacity: 0;
        display: none;
        transition: opacity 0.5s ease-in-out, visibility 0s ease-in-out;
        position: absolute; /* keep them stacked in same place */
        width: 100%;
        
      }

      .fade-section.show {
        opacity: 1;
        display: flex;
        position: relative; /* bring it back into flow */
      }

    </style>


  </head>
  <body class="bg-dark">

    <div class="container mt-5">
      <div class="row justify-content-center g-3">

        <!-- Student Card -->
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card text-center shadow-sm h-100 border-0">
            <div class="card-body d-flex flex-column justify-content-center align-items-center p-3">
              <i class="fa-solid fa-child fa-2x mb-2 text-primary"></i>
              <h6 class="card-title mb-1">Student</h6>
              <p class="card-text text-muted small mb-2">Access student dashboard</p>
              <button id="showStudentBtn" class="btn btn-sm btn-primary mt-auto">Student</button>
            </div>
          </div>
        </div>

        <!-- Teacher Card -->
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card text-center shadow-sm h-100 border-0">
            <div class="card-body d-flex flex-column justify-content-center align-items-center p-3">
              <i class="fa-solid fa-person-chalkboard fa-2x mb-2 text-warning"></i>
              <h6 class="card-title mb-1">Teacher</h6>
              <p class="card-text text-muted small mb-2">Access teacher dashboard</p>
              <button id="showTeacherBtn" class="btn btn-sm btn-warning mt-auto text-white">Teacher</button>
            </div>
          </div>
        </div>

        <!-- Admin Card -->
        <div class="col-12 col-sm-6 col-md-3">
          <div class="card text-center shadow-sm h-100 border-0">
            <div class="card-body d-flex flex-column justify-content-center align-items-center p-3">
              <i class="fa-solid fa-screwdriver-wrench fa-2x mb-2 text-danger"></i>
              <h6 class="card-title mb-1">Admin</h6>
              <p class="card-text text-muted small mb-2">Access admin dashboard</p>
              <button id="showAdminBtn" class="btn btn-sm btn-danger mt-auto">Admin</button>
            </div>
          </div>
        </div>

      </div>
    </div>

    
    <div class="d-flex justify-content-center mb-5">
            

        <div class="container    rounded-4 shadow-primary mt-5 py-3  "
        style="background-color:rgb(255, 255, 255); max-width: 90%; margin: 0 auto ">
               
        <!-- Student -->
        <div id="student" class="row align-items-center fade-section mx-0 show ">
            <div class="col-12 col-md-6">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/040/890/255/small/ai-generated-empty-wooden-table-on-the-natural-background-for-product-display-free-photo.jpg" 
            alt="Image"
            width="100%"
            class="border rounded-4">
            </div>
            
            <div class="col-12 col-md-6">
            <form action="#">
                <h1 class="text-center mb-4">Student's Login</h1>

                <input class="form-control mb-2" type="email" placeholder="Email">
                <input class="form-control mb-3" type="password" placeholder="Password">

                <button type="button" class="btn btn-primary w-100 mb-2" 
                onclick="window.location.href='/StudentFolder/student-side.html'"
                >Login</button>

                <a href="/Change-Password/forgotpassword.html">Forgot Passowrd</a>
                
            </form>
            </div>

        </div>


        <!-- Teacher -->
        <div id="teacher"  class="row align-items-center fade-section  mx-0">
            <div class="col-12 col-md-6">
            <img src="https://thumbs.dreamstime.com/b/incredibly-beautiful-sunset-sun-lake-sunrise-landscape-panorama-nature-sky-amazing-colorful-clouds-fantasy-design-115177001.jpg" 
            alt="Image"
            width="100%"
            class="border rounded-4">
            </div>


            <div class="col-12 col-md-6">
            <form action="#">
                <h1 class="text-center mb-4">Teacher Login</h1>

                <input class="form-control mb-2" type="email" placeholder="Email">
                <input class="form-control mb-3" type="password" placeholder="Password">

                <button type="button" class="btn btn-primary w-100 mb-2" 
                onclick="window.location.href='teacherdashboard.html'"
                >Login</button>

                <a href="/Change-Password/forgotpassword.html">Forgot Passowrd</a>
                
            </form>
            </div>

        </div>

           <!-- Admin -->
        <div id="admin"  class="row align-items-center fade-section  mx-0">
            <div class="col-12 col-md-6">
            <img src="https://thumbs.dreamstime.com/b/incredibly-beautiful-sunset-sun-lake-sunrise-landscape-panorama-nature-sky-amazing-colorful-clouds-fantasy-design-115177001.jpg" 
            alt="Image"
            width="100%"
            class="border rounded-4">
            </div>


            <div class="col-12 col-md-6">
            <form action="#">
                <h1 class="text-center mb-4">Admin Login</h1>

                <input class="form-control mb-2" type="email" placeholder="Email">
                <input class="form-control mb-3" type="password" placeholder="Password">

                <button type="button" class="btn btn-primary w-100 mb-2"
                onclick="window.location.href='/admin/admin-home.html'">
                Login</button>

                <a href="/Change-Password/forgotpassword.html">Forgot Passowrd</a>
                
            </form>
            </div>

        </div>
        
        </div>
    
    </div>



<script>

      const teacher =document.getElementById("teacher");
       const student =document.getElementById("student");
       const admin =document.getElementById("admin");
   
     function showTeacher(){
    
        teacher.classList.add("show");

        student.classList.remove("show");
        admin.classList.remove("show");
    

    }

     function showStudent(){
        student.classList.add("show");

        teacher.classList.remove("show");
        admin.classList.remove("show");
        

    }

    function showAdmin(){
        admin.classList.add("show");

        teacher.classList.remove("show");
        student.classList.remove("show");
        

    }

    showStudent();


    showTeacherBtn.addEventListener("click",showTeacher);
    showStudentBtn.addEventListener("click",showStudent)
    showAdminBtn.addEventListener("click",showAdmin)


</script>


    <!-- BS5 Js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  </body>
</html>
