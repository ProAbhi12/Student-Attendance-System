<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Attendance Nepal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <style>
      body {
        background-color: #f4f6fb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-card {
        width: 100%;
        max-width: 900px; /* Increased max-width for two columns */
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        overflow: hidden; /* Important for keeping rounded corners with columns */
      }

      .login-visuals {
        background-color: #f8f9fa;
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .login-visuals img {
        max-width: 250px;
        margin-bottom: 20px;
        transition: opacity 0.3s ease-in-out;
      }

      .login-form-section {
        padding: 40px;
      }

      .role-selector .btn {
        border-radius: 50rem !important;
        padding: 0.375rem 1rem;
        font-weight: 500;
        border: 1px solid #dee2e6;
        background-color: #f8f9fa;
        color: #495057;
      }

      .role-selector .btn.active {
        background-color: #4a90e2;
        color: white;
        border-color: #4a90e2;
        box-shadow: 0 4px 8px rgba(74, 144, 226, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="card login-card">
      <div class="row g-0">
        <div class="col-lg-6 d-none d-lg-block login-visuals">
          <img src="teacher.png" alt="Role Illustration" id="roleImage" />
          <h3 class="fw-bold mt-3" id="roleTitle">Teacher Portal</h3>
          <p class="text-muted" id="roleDescription">
            Mark attendance, manage leaves, and view student reports with ease.
          </p>
        </div>

        <div class="col-lg-6 login-form-section">
          <div class="text-center mb-4">
            <a
              class="navbar-brand fw-bold fs-4 d-inline-block"
              href="index.html"
            >
              <i class="bi bi-box-fill text-primary"></i>
              Attendance Nepal
            </a>
          </div>

          <h4 class="fw-bold text-center">Sign In</h4>
          <p class="text-muted text-center mb-4">
            Select your role and enter your details.
          </p>

          <form id="loginForm" action="#" method="POST">
            <!-- Role Selector Pills -->
            <div class="text-center mb-4">
              <div
                class="btn-group role-selector"
                role="group"
                aria-label="Role Selector"
              >
                <button
                  type="button"
                  class="btn role-selector-btn"
                  data-role="admin"
                >
                  Admin
                </button>
                <button
                  type="button"
                  class="btn role-selector-btn active"
                  data-role="teacher"
                >
                  Teacher
                </button>
                <button
                  type="button"
                  class="btn role-selector-btn"
                  data-role="student"
                >
                  Student
                </button>
              </div>
            </div>

            <!-- Hidden input to send role hint to backend (optional, but good practice) -->
            <input
              type="hidden"
              id="selectedRole"
              name="role_hint"
              value="teacher"
            />

            <div class="mb-3">
              <label for="emailInput" class="form-label">Email Address</label>
              <input
                type="text"
                class="form-control"
                id="emailInput"
                placeholder="Enter your email address"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="rememberMe"
                />
                <label class="form-check-label small" for="rememberMe"
                  >Remember me</label
                >
              </div>
              <a href="#" class="small text-decoration-none"
                >Forgot password?</a
              >
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg fw-bold">
                Login
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- JavaScript to handle UI changes -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const roleSelectorButtons =
          document.querySelectorAll(".role-selector-btn");
        const roleImage = document.getElementById("roleImage");
        const roleTitle = document.getElementById("roleTitle");
        const roleDescription = document.getElementById("roleDescription");
        const emailInput = document.getElementById("emailInput");
        const hiddenRoleInput = document.getElementById("selectedRole");

        const roleDetails = {
          admin: {
            image: "admin.png",
            title: "Admin Dashboard",
            description:
              "Oversee all school operations, manage users, and view comprehensive analytics.",
            placeholder: "Enter your admin email",
          },
          teacher: {
            image: "teacher.png",
            title: "Teacher Portal",
            description:
              "Mark attendance, manage student leaves, and track class performance efficiently.",
            placeholder: "Enter your teacher email",
          },
          student: {
            image: "student.png",
            title: "Student Dashboard",
            description:
              "View your attendance history, apply for leaves, and stay updated on your schedule.",
            placeholder: "Enter your student email",
          },
        };

        roleSelectorButtons.forEach((button) => {
          button.addEventListener("click", function () {
            // Remove active class from all buttons
            roleSelectorButtons.forEach((btn) =>
              btn.classList.remove("active")
            );
            // Add active class to the clicked button
            this.classList.add("active");

            const selectedRole = this.getAttribute("data-role");

            // Update the UI based on the selected role
            const details = roleDetails[selectedRole];
            if (details) {
              roleImage.style.opacity = 0; // Fade out
              setTimeout(() => {
                roleImage.src = details.image;
                roleTitle.textContent = details.title;
                roleDescription.textContent = details.description;
                emailInput.placeholder = details.placeholder;
                roleImage.style.opacity = 1; // Fade in
              }, 300); // Match timeout with CSS transition
            }

            // Update the hidden input field's value
            hiddenRoleInput.value = selectedRole;
          });
        });

        loginForm.addEventListener("submit", function (e) {
          e.preventDefault(); // stop real form submit for now (no backend)

          const selectedRole = hiddenRoleInput.value;

          if (selectedRole === "admin") {
            window.location.href = "Admin/admin-home.html";
          } else if (selectedRole === "teacher") {
            window.location.href = "Teacher/Teacher_Dashboard.html";
          } else if (selectedRole === "student") {
            window.location.href = "Student/Student_Dashboard.html";
          } else {
            // fallback, just in case
            window.location.href = "Student/Student_Dashboard.html";
          }
        });
      });
    </script>
  </body>
</html>
